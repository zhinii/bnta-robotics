<!doctype html>
<html lang="zh-CN" data-edition="public"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Lab</title><link rel="stylesheet" href="style.css"></head>
<body class="scene-hud touch-workspace">
<header><div class="brand"><strong data-en="Robot Lab" data-zh="机器人实验室"></strong><span data-en="Robotics · Learn, plan, program" data-zh="机器人学习 · 规划 · 编程"></span></div><nav id="workspace-tabs" aria-label="Workspace / 工作区">
<button data-workspace="learn" aria-pressed="false"><span aria-hidden="true">◫</span><span data-en="Learn" data-zh="学习"></span></button>
<button data-workspace="control" aria-pressed="true"><span aria-hidden="true">✥</span><span data-en="Control" data-zh="操作"></span></button>
<button data-workspace="program" aria-pressed="false"><span aria-hidden="true">≡</span><span data-en="Program" data-zh="程序"></span><small id="nav-program-count">0</small></button>
<button data-workspace="challenge" aria-pressed="false"><span aria-hidden="true">⚑</span><span data-en="Challenge" data-zh="挑战"></span></button></nav><button id="mission-button" class="mission-button"><span data-en="Loading mission" data-zh="装载任务"></span><b id="score">0 / 3</b></button><button id="language" aria-label="Language / 语言">EN / 中文</button><details id="workspace-menu"><summary aria-label="Workspace menu / 工作区菜单">⋯</summary><div class="workspace-menu-items"><div id="extra-activities" class="extra-activities"></div><button id="help" data-en="Help" data-zh="帮助"></button><button id="undo" data-en="Undo program edit" data-zh="撤销程序编辑"></button><button id="save" data-en="Export progress" data-zh="导出进度"></button><button id="load" data-en="Import progress" data-zh="导入进度"></button><button id="reset" data-en="Reset robot & boxes" data-zh="重置机器人与箱子"></button><button id="clear" data-en="Clear program" data-zh="清空程序"></button></div></details><input type="file" id="file" accept="application/json,.json" hidden></header>
<main><section class="workspace"><div class="scene-stage"><div id="viewport"><div id="task-goal"><span id="task-goal-text"></span><button id="watch-simulation" hidden data-en="Watch simulation" data-zh="观看模拟"></button><button id="task-goal-details" data-en="Task reference" data-zh="任务参考"></button></div><div id="path-legend"><span class="trail-key" data-en="Orange: actual" data-zh="橙色：实际"></span><span class="planned-key" data-en="Dashed blue: expected" data-zh="蓝色虚线：预计"></span><span class="blocked-key" data-en="Red ×: blocked" data-zh="红色 ×：受阻"></span></div><div class="scene-caption"><span class="dot"></span><span data-en="ROBOT WORKSPACE · 6 JOINTS" data-zh="机器人工作区 · 6 个关节"></span></div><div id="lesson-strip"><div id="guide" hidden></div></div><div class="telemetry"><small id="position-frame"></small><div id="position"></div><small id="waypoint-reference" hidden></small><small id="orientation"></small><section id="work-reference" aria-label="Held object destination / 已夹持物体的放置目标"><div id="reference-content"></div></section></div><div id="view-cube"></div><div class="scene-options" role="group" aria-label="Scene overlays / 场景显示"><div class="view-actions"><label><input id="trail" type="checkbox" checked><span data-en="Trail" data-zh="实际轨迹"></span></label><label><input id="path-preview" type="checkbox" checked><span data-en="Path" data-zh="预计路径"></span></label></div></div><div class="path-hud"><div id="held-dimensions" hidden></div><div id="path-feedback" role="status" hidden></div></div><div id="target-readout" hidden></div></div></div><section id="context-drawer" data-collapsed="false"><div class="drawer-bar"><h2 id="drawer-title"></h2><button id="drawer-toggle" aria-expanded="true" data-en="Hide tools ⌄" data-zh="收起工具 ⌄"></button></div><div id="drawer-body"><section id="learn-panel" hidden><p class="drawer-intro" data-en="Understand it. Try it. Make it work." data-zh="认识原理，动手尝试，完成任务。"></p><nav id="journey-nav" aria-label="Learning progress / 学习进度"><div id="journey-steps"></div><button id="journey-toggle" hidden></button></nav><p class="drawer-note" data-en="Choose a short lesson. Your robot and program are kept while you learn." data-zh="选择一个短课程。学习时会保留你的机器人与程序状态。"></p></section><section class="control-dock" id="controls"><div class="hud-card-heading"><strong data-en="Move robot" data-zh="移动机器人"></strong><button id="collapse-controls" aria-expanded="true" aria-label="Collapse movement controls / 收起移动控制">−</button></div><div id="controls-body"><div class="motion-toolbar"><label class="mode-select"><span data-en="Control" data-zh="控制方式"></span><select id="control-mode" aria-label="Movement mode / 操作方式"><option value="xyz" data-en="XYZ" data-zh="XYZ"></option><option value="joints" data-en="Joints" data-zh="关节角度"></option><option value="jog" data-en="Jog" data-zh="点动"></option></select></label><button id="move" class="primary" data-en="Move" data-zh="移动"></button><button id="grip-toggle" type="button" aria-pressed="false"><b id="output-value">DO1 OFF</b><span id="output-action"></span></button><button id="robot-home" aria-label="Return to home pose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></button></div><span id="sensor" class="grip-feedback"></span><div class="dock-heading"><div class="tabs" role="tablist" aria-label="Control mode"><button data-mode="xyz" class="active" role="tab" data-en="Coordinates" data-zh="坐标"></button><button data-mode="jog" role="tab" data-en="Jog" data-zh="点动"></button><button data-mode="joints" role="tab" data-en="Joints" data-zh="关节"></button></div></div><div id="movement"></div><details id="control-extras"><summary data-en="Target & settings" data-zh="目标与设置"></summary><section id="pickup-reference" class="pickup-reference" aria-label="Pickup target / 取货目标"><div id="pickup-readout"></div></section><details id="robot-settings" class="robot-settings"><summary data-en="Settings" data-zh="设置" aria-label="Robot settings / 机器人设置"></summary><div class="robot-settings-content"><div id="motion-options"></div></div></details><details id="physics-lesson" class="physics-lesson"><summary data-en="Gravity & handling" data-zh="重力与搬运"></summary><div id="physics-info"></div></details></details></div></section>
<aside id="program-panel" data-program-tab="record" aria-label="Program / 程序">
<div class="hud-card-heading"><strong data-en="Program" data-zh="程序"></strong><span id="program-count" aria-live="polite">0</span></div>
<div class="program-tabs" role="tablist" aria-label="Program mode / 程序模式"><button id="program-record-tab" role="tab" aria-controls="record-panel" aria-selected="true" data-en="＋ Add" data-zh="＋ 添加"></button><button id="program-run-tab" role="tab" aria-controls="run-panel" aria-selected="false" data-en="Steps" data-zh="步骤"></button></div>
<div id="record-panel" hidden><small id="capture-feedback" aria-live="polite"></small></div>
<div id="review-layout" hidden><ol id="steps" hidden aria-label="Program steps / 程序步骤"></ol><div class="review-detail-column"><p id="review-empty" data-en="Select a step to preview." data-zh="选择步骤以预览。"></p><div id="review-selection" hidden><div class="selected-step-heading"><strong id="selected-summary"></strong><button id="play-position" type="button" hidden aria-label="Move to selected position / 移动到所选位置">▶</button></div><div id="selected-details"></div></div></div></div>
<div class="program-bottom"><div id="run-panel" role="tabpanel" aria-labelledby="program-run-tab" hidden><div class="review-tools"><button id="preview-program" data-en="Preview" data-zh="预览路径"></button></div><div class="attempt-bar" id="attempt-bar"><span id="attempt-clock"></span><button id="attempt-action"></button></div><div class="metrics"><span id="distance"></span><span id="faults"></span></div></div></div>
</aside><section id="challenge-panel" hidden><p class="drawer-intro" data-en="Put your program to work." data-zh="让你的程序完成任务。"></p><div class="challenge-choices"><button data-challenge="7"><b data-en="01 · TCP waypoints" data-zh="01 · TCP 路点"></b><span data-en="Reach three points in order. Plan around obstacles, record, then run." data-zh="按顺序到达三个路点。绕开障碍，记录并运行程序。"></span></button><button data-challenge="4"><b data-en="02 · Pick up & deliver" data-zh="02 · 夹取与运送"></b><span data-en="Three boxes. Assigned destinations. Your sequence." data-zh="三个箱子、指定位置，自行编写动作顺序。"></span></button><button data-challenge="5"><b data-en="03 · Stack & avoid" data-zh="03 · 堆叠与避障"></b><span data-en="Two levels and an obstacle. Build on your first transfer." data-zh="两层堆叠与障碍，在首次搬运的基础上拓展。"></span></button><button id="open-explore"><b data-en="Explore" data-zh="自由探索"></b><span data-en="Move and experiment without a timer." data-zh="不计时，自由操作与实验。"></span></button></div></section></div><div id="playback-dock" hidden aria-label="Program playback / 程序播放"><span id="playback-state" role="status"></span><div class="run-row"><button id="run" class="primary" data-en="▶ Run" data-zh="▶ 运行"></button><button id="pause" data-en="Pause" data-zh="暂停"></button><button id="stop" data-en="Stop" data-zh="停止"></button></div></div><div id="teach-bridge"><button id="quick-record" class="primary" data-en="＋ Save" data-zh="＋ 保存"></button><button id="quick-program"><span data-en="Program →" data-zh="程序 →"></span></button><span id="quick-feedback" role="status"></span></div></section><div id="status" role="status" aria-live="polite"></div></section></main><footer class="public-credit" aria-label="Project credits / 项目署名"><span data-en="Developed by Christopher Hansen" data-zh="由 Christopher Hansen 开发">Developed by Christopher Hansen</span><span data-en="Sharing or adapting? Credit Christopher Hansen." data-zh="分享或改编时，请注明 Christopher Hansen。">Sharing or adapting? Credit Christopher Hansen.</span><span><a href="https://github.com/zhinii/bnta-robotics#credit-and-license">GitHub · Credits / 项目署名</a> · <a href="LICENSE">MIT · Retain license notices / 保留许可声明</a></span></footer><dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
<script src="app.js"></script></body></html>
