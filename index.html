<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BNTA · Robot Lab</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><img src="academy-logo.svg" alt="北京新英才学校 Beijing New Talent Academy" class="logo"><div class="brand"><strong data-en="Robot Lab" data-zh="机器人实验室"></strong><span data-en="Robotics · Learn, plan, program" data-zh="机器人学习 · 规划 · 编程"></span></div><button id="mission-button" class="mission-button"><span data-en="Loading mission" data-zh="装载任务"></span><b id="score">0 / 6</b></button><button id="learn-button" data-en="Learning journey" data-zh="学习之旅"></button><button id="language" aria-label="Language / 语言">EN / 中文</button></header>
<nav id="journey-nav" aria-label="Learning progress / 学习进度"><div id="journey-steps"></div><button id="journey-toggle"></button></nav><main>
<section class="workspace" aria-label="Robot workspace">
<div id="viewport"><div class="scene-caption"><span class="dot"></span><span data-en="ROBOT WORKSPACE · 6 JOINTS" data-zh="机器人工作区 · 6 个关节"></span></div><div class="telemetry"><small id="position-frame"></small><div id="position"></div><small id="orientation"></small></div><div id="view-cube"></div><div class="view-actions"><button id="top-view" data-en="Top view" data-zh="俯视"></button><button id="front-view" hidden data-en="Front view" data-zh="正视"></button><button id="iso-view" data-en="3D view" data-zh="三维"></button><label><input id="trail" type="checkbox" checked><span data-en="Trail" data-zh="实际轨迹"></span></label><label><input id="path-preview" type="checkbox" checked><span data-en="Path" data-zh="预计路径"></span></label></div><div class="path-hud"><div id="held-dimensions" hidden></div><div id="path-legend"><span class="trail-key" data-en="Orange: actual" data-zh="橙色：实际"></span><span class="planned-key" data-en="Dashed blue: expected" data-zh="蓝色虚线：预计"></span><span class="blocked-key" data-en="Red ×: blocked" data-zh="红色 ×：受阻"></span></div><div id="path-feedback" role="status" hidden></div></div><div id="target-readout" hidden></div><div id="guide" hidden></div><div id="status" role="status" aria-live="polite"></div></div>
<section class="control-dock" id="controls"><div class="dock-heading"><div class="tabs" role="tablist" aria-label="Control mode"><button data-mode="xyz" class="active" role="tab" data-en="Coordinates" data-zh="坐标"></button><button data-mode="jog" role="tab" data-en="Jog" data-zh="点动"></button><button data-mode="joints" role="tab" data-en="Joints" data-zh="关节"></button></div><div class="grip"><span id="sensor"></span><button id="grip-open" data-en="Open" data-zh="张开"></button><button id="grip-close" data-en="Close gripper" data-zh="闭合夹爪"></button></div></div><div class="frame-row"><label><span data-en="Coordinates from" data-zh="坐标参考"></span> <select id="coordinate-frame" aria-label="Coordinate frame / 坐标系"><option value="robot" data-en="Robot origin" data-zh="机器人原点"></option><option value="bed" data-en="Truck-bed zero" data-zh="车厢局部零点"></option></select></label><button id="set-zero" data-en="Set bed zero…" data-zh="设置车厢零点…"></button><small id="frame-note"></small></div><div id="motion-options"></div><div id="movement"></div><details id="work-reference"><summary data-en="Truck / shelf position reference" data-zh="车厢 / 货架位置参考"></summary><div id="reference-content"></div></details></section>
</section>
<aside id="program-panel"><div class="panel-heading"><div><span class="eyebrow" data-en="BUILD • TEST • IMPROVE" data-zh="编写 · 测试 · 改进"></span><h1 data-en="Your program" data-zh="我的程序"></h1></div><button id="help" class="icon" aria-label="Help / 帮助">?</button></div><div class="command-box"><button id="record" class="primary" data-en="＋ Record position" data-zh="＋ 记录当前位置"></button><div class="command-row"><button id="add-close" data-en="＋ Close" data-zh="＋ 闭合"></button><button id="add-open" data-en="＋ Open" data-zh="＋ 张开"></button><button id="add-wait" data-en="＋ Wait DI1" data-zh="＋ 等待 DI1"></button></div><p data-en="Move the robot, then record. Add gripper commands in order." data-zh="先移动机器人，再记录位置。按顺序添加夹爪指令。"></p></div><ol id="steps"></ol><div class="program-bottom"><button id="preview-program" data-en="Preview program path" data-zh="预览程序路径"></button><div class="run-row"><button id="run" class="primary" data-en="▶ Run" data-zh="▶ 运行"></button><button id="pause" data-en="Pause" data-zh="暂停"></button><button id="stop" data-en="Stop" data-zh="停止"></button></div><div class="attempt-bar" id="attempt-bar"><span id="attempt-clock"></span><button id="attempt-action"></button></div><div class="metrics"><span id="distance"></span><span id="faults"></span></div><button id="undo" data-en="Undo program edit" data-zh="撤销程序编辑"></button><div class="utilities"><button id="reset" data-en="Reset scene" data-zh="重置场景"></button><button id="save" data-en="Export progress" data-zh="导出进度"></button><button id="load" data-en="Import progress" data-zh="导入进度"></button><button id="clear" data-en="Clear" data-zh="清空"></button></div><input type="file" id="file" accept="application/json,.json" hidden></div></aside>
</main><footer class="public-credit" aria-label="Project credits / 项目署名"><span data-en="Developed by Christopher Hanse for BNTA" data-zh="由 Christopher Hanse 为 BNTA 开发">Developed by Christopher Hanse for BNTA</span><span data-en="Sharing or adapting? Credit Christopher Hanse, BNTA, or both." data-zh="分享或改编时，请注明 Christopher Hanse、BNTA 或双方。">Sharing or adapting? Credit Christopher Hanse, BNTA, or both.</span><span><a href="https://github.com/zhinii/bnta-robotics#credit-and-license">GitHub · Credits / 项目署名</a> · <a href="LICENSE">MIT · Retain license notices / 保留许可声明</a></span></footer>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
<script src="app.js"></script></body></html>
