<!doctype html>
<html lang="zh-CN" data-edition="public"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Lab</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><strong data-en="Robot Lab" data-zh="机器人实验室"></strong><span data-en="Robotics · Learn, plan, program" data-zh="机器人学习 · 规划 · 编程"></span></div><button id="mission-button" class="mission-button"><span data-en="Loading mission" data-zh="装载任务"></span><b id="score">0 / 3</b></button><button id="language" aria-label="Language / 语言">EN / 中文</button></header>
<nav id="journey-nav" aria-label="Learning progress / 学习进度"><div id="journey-steps"></div><button id="journey-toggle" hidden></button></nav><div id="task-goal"><span id="task-goal-text"></span><button id="watch-simulation" hidden data-en="Watch simulation" data-zh="观看模拟"></button><button id="task-goal-details" data-en="Task reference" data-zh="任务参考"></button></div><main>
<section class="workspace" aria-label="Robot workspace">
<div class="scene-stage"><div id="viewport"><div id="path-legend"><span class="trail-key" data-en="Orange: actual" data-zh="橙色：实际"></span><span class="planned-key" data-en="Dashed blue: expected" data-zh="蓝色虚线：预计"></span><span class="blocked-key" data-en="Red ×: blocked" data-zh="红色 ×：受阻"></span></div><div class="scene-caption"><span class="dot"></span><span data-en="ROBOT WORKSPACE · 6 JOINTS" data-zh="机器人工作区 · 6 个关节"></span></div><div class="telemetry"><small id="position-frame"></small><div id="position"></div><small id="orientation"></small><section id="work-reference" aria-label="Held object destination / 已夹持物体的放置目标"><div id="reference-content"></div></section></div><div id="view-cube"></div><div class="camera-views"><button id="top-view" data-en="Top view" data-zh="俯视"></button><button id="front-view" hidden data-en="Front view" data-zh="正视"></button><button id="iso-view" data-en="3D view" data-zh="三维"></button></div><div class="view-actions"><label><input id="trail" type="checkbox" checked><span data-en="Trail" data-zh="实际轨迹"></span></label><label><input id="path-preview" type="checkbox" checked><span data-en="Path" data-zh="预计路径"></span></label></div><div class="path-hud"><div id="held-dimensions" hidden></div><div id="path-feedback" role="status" hidden></div></div><div id="target-readout" hidden></div><div id="guide" hidden></div><div id="status" role="status" aria-live="polite"></div></div></div>
<section class="control-dock" id="controls"><strong class="command-heading" data-en="DO NOW · ROBOT CONTROLS" data-zh="立即操作 · 机器人控制"></strong><div class="dock-heading"><div class="tabs" role="tablist" aria-label="Control mode"><button data-mode="xyz" class="active" role="tab" data-en="Coordinates" data-zh="坐标"></button><button data-mode="jog" role="tab" data-en="Jog" data-zh="点动"></button><button data-mode="joints" role="tab" data-en="Joints" data-zh="关节"></button></div><div class="grip"><span id="sensor"></span><button id="grip-open" data-en="Open" data-zh="张开"></button><button id="grip-close" data-en="Close gripper" data-zh="闭合夹爪"></button></div></div><section id="pickup-reference" class="pickup-reference" aria-label="Pickup target / 取货目标"><div id="pickup-readout"></div></section><div id="movement"></div><details id="robot-settings" class="robot-settings"><summary data-en="Settings" data-zh="设置" aria-label="Robot settings / 机器人设置"></summary><div class="robot-settings-content"><div id="motion-options"></div></div></details><details id="physics-lesson" class="physics-lesson"><summary data-en="Gravity & handling" data-zh="重力与搬运"></summary><div id="physics-info"></div></details></section>
</section>
<aside id="program-panel" data-program-tab="record"><div class="panel-heading"><div><span class="eyebrow" data-en="BUILD • TEST • IMPROVE" data-zh="编写 · 测试 · 改进"></span><h1 data-en="Your program" data-zh="我的程序"></h1></div><button id="help" class="icon" aria-label="Help / 帮助">?</button></div><div class="program-tabs" role="tablist" aria-label="Program mode / 程序模式"><button id="program-record-tab" role="tab" aria-controls="record-panel" aria-selected="true" data-en="Record" data-zh="记录"></button><button id="program-run-tab" role="tab" aria-controls="run-panel" aria-selected="false" tabindex="-1" data-en="Run" data-zh="运行"></button></div><div class="command-box" id="record-panel" role="tabpanel" aria-labelledby="program-record-tab"><strong class="command-heading" data-en="ADD TO PROGRAM" data-zh="添加到程序"></strong><button id="record" class="primary" data-en="＋ Record position" data-zh="＋ 记录当前位置"></button><div class="command-row"><button id="add-close" data-en="＋ Close" data-zh="＋ 闭合"></button><button id="add-open" data-en="＋ Open" data-zh="＋ 张开"></button><button id="add-wait" data-en="＋ Check grip" data-zh="＋ 检查夹持"></button></div><p data-en="Move the robot, then record. Add gripper commands in order." data-zh="先移动机器人，再记录位置。按顺序添加夹爪指令。"></p></div><ol id="steps"></ol><div class="program-bottom"><div id="run-panel" role="tabpanel" aria-labelledby="program-run-tab" hidden><button id="preview-program" data-en="Preview without moving" data-zh="预览（不移动机器人）"></button><div class="run-row"><button id="run" class="primary" data-en="▶ Run" data-zh="▶ 运行"></button><button id="pause" data-en="Pause" data-zh="暂停"></button><button id="stop" data-en="Stop" data-zh="停止"></button></div><div class="attempt-bar" id="attempt-bar"><span id="attempt-clock"></span><button id="attempt-action"></button></div><div class="metrics"><span id="distance"></span><span id="faults"></span></div></div><button id="undo" data-en="Undo program edit" data-zh="撤销程序编辑"></button><div class="utilities"><button id="reset" data-en="Reset robot & boxes" data-zh="重置机器人与箱子" title="Keeps your program / 保留程序"></button><button id="save" data-en="Export progress" data-zh="导出进度"></button><button id="load" data-en="Import progress" data-zh="导入进度"></button><button id="clear" data-en="Clear program" data-zh="清空程序"></button></div><input type="file" id="file" accept="application/json,.json" hidden></div></aside>
</main><footer class="public-credit" aria-label="Project credits / 项目署名"><img src="academy-logo.svg" class="credit-logo" alt="BNTA · Beijing New Talent Academy / 北京市新英才学校"><span data-en="Developed by Christopher Hansen for BNTA" data-zh="由 Christopher Hansen 为 BNTA 开发">Developed by Christopher Hansen for BNTA</span><span data-en="Sharing or adapting? Credit Christopher Hansen, BNTA, or both." data-zh="分享或改编时，请注明 Christopher Hansen、BNTA 或双方。">Sharing or adapting? Credit Christopher Hansen, BNTA, or both.</span><span><a href="https://github.com/zhinii/bnta-robotics#credit-and-license">GitHub · Credits / 项目署名</a> · <a href="LICENSE">MIT · Retain license notices / 保留许可声明</a></span></footer>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
<script src="app.js"></script></body></html>
