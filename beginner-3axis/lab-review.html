<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Lab · Room review</title><style>body{margin:0;background:#102431;color:white;font:15px system-ui}nav{position:absolute;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,a{padding:10px 16px;background:#214756;color:white;border:1px solid #7898a1;border-radius:6px;text-decoration:none}button[aria-pressed=true]{background:#007e94}canvas{display:block}aside{position:absolute;bottom:16px;left:16px;background:#102431dc;padding:12px;max-width:600px}</style><nav><strong>Lab interior review</strong><button data-side="north">North</button><button data-side="east">East</button><button data-side="south">South · entrance</button><button data-side="west">West · fabrication</button><a href="./">Robot Lab</a></nav><aside id="caption"></aside><script type="module">
import * as THREE from './vendor/three/build/three.module.js';
import {createClassroom,LAB_FAR_PLANE} from './classroom.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xaabdc7);scene.add(createClassroom());scene.add(new THREE.HemisphereLight(0xffffff,0x79888b,2.1));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(-150,-250,500);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(78,1,1,LAB_FAR_PLANE);camera.up.set(0,0,1);camera.position.set(0,0,600);
const views={north:[0,4500,850],east:[4500,0,700],south:[0,-4500,700],west:[-4500,0,700]};const captions={north:'North: daylight windows, research charts, equipment racks and tool cart.',east:'East: electronics tools, instruments, storage and student prototypes.',south:'South: entrance door with vision panel and handle, project displays and tool storage.',west:'West: enclosed CNC, laser cutter and extraction unit, wall tools and wheeled carts.'};let side='south';function draw(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.lookAt(...views[side]);camera.updateProjectionMatrix();renderer.render(scene,camera);}for(const b of document.querySelectorAll('button'))b.onclick=()=>{side=b.dataset.side;for(const n of document.querySelectorAll('button'))n.setAttribute('aria-pressed',String(n===b));document.getElementById('caption').textContent=captions[side];draw();};document.querySelector('[data-side=south]').click();addEventListener('resize',draw);
</script></html>
