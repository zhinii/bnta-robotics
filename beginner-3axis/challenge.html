<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Robot Lab · 机器人实验室</title>
<link rel="stylesheet" href="./challenge.css?v=location-text-1"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script></head>
<body>
<header class="top">
 <div class="brand"><span aria-hidden="true">◎</span><strong data-t="title">Robot Lab</strong></div>
 <nav class="levels" aria-label="Explore and challenges / 探索与挑战"><button data-mode="explore" aria-pressed="true"><span aria-hidden="true">∞</span><strong data-t="explore"></strong></button><button data-mode="easy" aria-pressed="false"><span aria-hidden="true">01</span><strong data-t="easy"></strong></button><button data-mode="medium" aria-pressed="false"><span aria-hidden="true">02</span><strong data-t="medium"></strong></button><button data-mode="hard" aria-pressed="false"><span aria-hidden="true">03</span><strong data-t="hard"></strong></button></nav>
 <div class="top-actions"><select id="language" aria-label="Language / 语言"><option value="en">EN</option><option value="zh">中文</option></select><button id="stop" class="danger" data-t="stop">■ Stop</button></div>
</header>
<main>
 <section id="world" aria-label="Robot scene / 机械臂场景">
  <div class="world-heading"><div><h1 id="task-name"></h1><p id="task-summary"></p></div><div id="explore-robot" role="group"><span data-t="robot"></span><div class="segmented"><button data-robot-axes="3" aria-pressed="false" data-t="threeAxes"></button><button data-robot-axes="6" aria-pressed="true" data-t="sixAxes"></button></div></div><button id="task-toggle" class="text-button" aria-expanded="false" aria-controls="task-card" data-t="taskInfo"></button></div>
  <div id="task-card" hidden><p id="task-description"></p><div id="checks"></div><small class="model-note" data-t="limitsNote"></small></div>
  <div class="scene-viewport"><div id="scene"></div><div class="scene-tools"><button id="home" data-t="view"></button><button id="reset" data-t="reset"></button></div><div id="failure" role="alert" hidden><strong id="failure-reason"></strong><button id="restart" data-t="restartAttempt"></button></div><div id="replay-prompt" hidden></div><div id="completion" hidden><strong data-t="complete"></strong><button id="next" data-t="next"></button></div></div>
  <section id="locations"><h2 id="locations-title"></h2><div id="task-positions"></div></section>
 </section>
 <aside id="panel" aria-label="Robot controls and program / 机械臂控制与程序">
  <div class="tabs" role="group" aria-label="Workspace / 工作区"><button data-tab="controls" aria-pressed="true" data-t="controls"></button><button data-tab="program" aria-pressed="false"><span data-t="program"></span><span id="step-count">0</span></button></div>
  <div id="arm-picker" hidden><strong data-t="controlling"></strong><div class="segmented"><button data-arm="A" class="arm-a" aria-pressed="true" data-t="armA"></button><button data-arm="B" class="arm-b" aria-pressed="false" data-t="armB"></button></div></div>
  <section id="coordinate-readout" aria-label="Robot position and planned position / 机械臂位置与计划位置"><div id="tcp"></div><div id="target-tcp"></div></section>
  <div id="panel-scroll">
   <section id="controls-panel">
    <div class="control-heading"><h2 data-t="moveRobot"></h2><div id="control-mode" class="segmented" role="group"><button data-control="xyz" aria-pressed="true" data-t="xyzShort"></button><button data-control="joints" aria-pressed="false" data-t="jointsShort"></button></div><span id="control-title" class="sr-only"></span></div>
    <div id="xyz-inputs" class="xyz"></div><div id="joint-inputs"></div>
   </section>
   <section id="program-panel" hidden><div class="program-heading"><strong id="attempt-stage"></strong><details class="program-help"><summary data-t="programHelpLabel"></summary><p data-t="programHelp"></p><p data-t="timerHelp"></p></details></div><ol id="steps"></ol><div class="append"><select id="append-action" aria-label="Append action / 添加动作"><option value="open" data-t="open"></option><option value="close" data-t="close"></option></select><button id="append" data-t="addAction"></button><button id="clear" data-t="clear"></button></div></section>
  </div>
  <div id="controls-actions"><p id="preview-state"></p><div class="primary-actions"><button id="move" class="primary" data-t="moveNow"></button><button id="add-move" data-t="addProgramStep"></button></div><div class="grip-actions"><strong data-t="gripper"></strong><button data-action="open" data-t="open"></button><button data-action="close" data-t="close"></button></div></div>
  <div id="record-bar"><button id="record" type="button" aria-pressed="false"></button><button id="show-program" class="text-button" data-t="playbackResults"></button></div>
  <section id="playback-panel" hidden><div class="playback-actions"><button id="run" class="primary" data-t="run"></button><button id="pause" data-t="pause"></button></div><div class="results-heading"><h2 data-t="replayResults"></h2><span id="timer-status"></span></div><div class="replay-stats"><div><small data-t="replayTime"></small><strong id="replay-time">0.00 s</strong></div><div><small data-t="moveCount"></small><strong id="replay-moves">0 / 0</strong></div><div><small data-t="actionCount"></small><strong id="replay-actions">0 / 0</strong></div></div><small class="metric-note" data-t="actionsNote"></small><div class="program-files"><button id="export" data-t="save"></button><button id="import" data-t="load"></button><input id="file" type="file" accept="application/json,.json" hidden></div><small id="save-state" data-t="sessionOnly"></small></section>
  <div id="feedback" role="status" aria-live="polite"></div>
 </aside>
</main><script type="module" src="./challenge-ui.mjs?v=gripper-collisions-1"></script></body></html>
