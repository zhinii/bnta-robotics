<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Robot challenges · 机器人挑战</title>
<link rel="stylesheet" href="./challenge.css"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script></head>
<body>
<header class="top"><div class="brand"><span class="brand-icon">◎</span><div><strong data-t="title">Robot challenges</strong><small data-t="tagline"></small></div></div><div class="top-actions"><select id="language" aria-label="Language / 语言"><option value="en">English</option><option value="zh">中文</option></select><button id="stop" class="danger" data-t="stop">■ Stop</button></div></header>
<nav class="levels" aria-label="Challenge / 挑战"><button data-mode="easy" aria-pressed="true"><span>01</span><div><strong data-t="easy"></strong><small data-t="easyName"></small></div></button><button data-mode="medium" aria-pressed="false"><span>02</span><div><strong data-t="medium"></strong><small data-t="mediumName"></small></div></button><button data-mode="hard" aria-pressed="false"><span>03</span><div><strong data-t="hard"></strong><small data-t="hardName"></small></div></button></nav>
<main>
 <section id="world"><div id="scene"></div><div id="task-card"><div class="eyebrow" id="task-name"></div><p id="task-description"></p><div id="checks"></div></div><div class="scene-tools"><button id="home" data-t="view"></button><button id="reset" data-t="reset"></button></div><div id="completion" hidden><strong data-t="complete"></strong><button id="next" data-t="next"></button></div><small class="model-note" data-t="limitsNote"></small></section>
 <aside id="panel">
  <div id="arm-picker" hidden><span data-t="arm"></span><div><button data-arm="A" class="arm-a" aria-pressed="true" data-t="armA"></button><button data-arm="B" class="arm-b" aria-pressed="false" data-t="armB"></button></div></div>
  <div class="record-bar"><button id="record" type="button" aria-pressed="false"></button><span id="timer-status"></span></div>
  <div class="replay-stats" aria-label="Replay metrics / 回放数据"><div><small data-t="replayTime"></small><strong id="replay-time">0.00 s</strong></div><div><small data-t="moveCount"></small><strong id="replay-moves">0 / 0</strong></div><div><small data-t="actionCount"></small><strong id="replay-actions">0 / 0</strong></div></div>
  <div class="tabs"><button data-tab="controls" aria-pressed="true" data-t="controls"></button><button data-tab="program" aria-pressed="false"><span data-t="program"></span><span id="step-count">0</span></button></div>
  <div id="panel-scroll">
   <section id="controls-panel">
    <div class="control-heading"><div class="control-modes"><strong id="control-title"></strong><button id="control-mode" type="button">XYZ</button></div><span id="tcp"></span><span id="target-tcp"></span></div>
    <div id="xyz-inputs" class="xyz"></div><div id="joint-inputs"></div>
    <p id="preview-state"></p><div class="primary-actions"><button id="move" class="primary" data-t="move"></button><button id="add-move" data-t="addMove"></button></div>
    <div class="grip-actions"><button data-action="open" data-t="open"></button><button data-action="close" data-t="close"></button></div>
    <p class="muted" data-t="recordHelp"></p>
    <details id="positions"><summary data-t="coordinates"></summary><div id="task-positions"></div><p class="muted" data-t="coordsNote"></p></details>
   </section>
   <section id="program-panel" hidden><p class="muted" data-t="programHelp"></p><p class="muted" data-t="timerHelp"></p><ol id="steps"></ol><div class="append"><select id="append-action" aria-label="Append action / 添加动作"><option value="open" data-t="open"></option><option value="close" data-t="close"></option></select><button id="append" data-t="add"></button></div><div class="program-actions"><button id="run" class="primary" data-t="run"></button><button id="pause" data-t="pause"></button><button id="clear" data-t="clear"></button></div><div class="files"><button id="export" data-t="save"></button><button id="import" data-t="load"></button><input id="file" type="file" accept="application/json,.json" hidden></div><small class="muted" id="save-state" data-t="savedLocally"></small></section>
  </div>
  <div id="feedback" role="status" aria-live="polite"></div><form id="command-form"><input id="command" maxlength="240" autocomplete="off" aria-label="Command / 命令"><button class="primary" data-t="send" type="submit"></button></form>
 </aside>
</main><script type="module" src="./challenge-ui.mjs"></script></body></html>
